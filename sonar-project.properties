sonar.organization=zackria
sonar.projectKey=zackria_bit-switch
sonar.projectName=Bit Switch

sonar.sources=lib
sonar.tests=test

# lib/l10n/** is generated by `flutter gen-l10n` from lib/l10n/*.arb — each
# locale file necessarily repeats the same translated-getter structure, so
# the duplication is inherent to generated code and not a real code smell.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,lib/l10n/**

# LCOV coverage report produced by `flutter test --coverage`
sonar.dart.coverage.reportPaths=coverage/lcov.info
